! ==========================================
! Router 0 Configuration - Experiment 1.5 (Dynamic Routing RIP)
! Device recommendation: "Router-PT" (has Fa0/0, Se2/0, Se3/0 built-in)
! ==========================================
enable
configure terminal
! LAN connection to Switch0 / PC0
interface fastEthernet 0/0
 ip address 192.168.1.1 255.255.255.0
 no shutdown
 exit
! WAN link to Router 1
interface serial 2/0
 ip address 10.0.0.1 255.0.0.0
 clock rate 64000
 no shutdown
 exit
! WAN link to Router 2
interface serial 3/0
 ip address 20.0.0.1 255.0.0.0
 clock rate 64000
 no shutdown
 exit
! RIP Routing Configuration
router rip
 version 2
 network 10.0.0.0
 network 20.0.0.0
 network 192.168.1.0
 no auto-summary
end
write memory
