! ==========================================
! Router 1 Configuration - Experiment 1.4
! Static Routing Lab (Right Router)
! ==========================================
enable
configure terminal
interface fastEthernet 0/0
 ip address 20.0.0.1 255.0.0.0
 no shutdown
 exit
interface fastEthernet 1/0
 ip address 192.168.1.2 255.255.255.0
 no shutdown
 exit
! Static route to LAN 1 via Router 0 next-hop
ip route 10.0.0.0 255.0.0.0 192.168.1.1
end
write memory
