! ==========================================
! Router 3 Configuration - Experiment 1.5 (Dynamic Routing RIP)
! Device recommendation: "Router-PT"
! ==========================================
enable
configure terminal
! LAN connection to Switch1 / PC1
interface fastEthernet 0/0
 ip address 172.16.10.1 255.255.0.0
 no shutdown
 exit
! WAN link to Router 2
interface serial 2/0
 ip address 40.0.0.2 255.0.0.0
 no shutdown
 exit
! WAN link to Router 1
interface serial 3/0
 ip address 30.0.0.2 255.0.0.0
 no shutdown
 exit
! RIP Routing Configuration
router rip
 version 2
 network 30.0.0.0
 network 40.0.0.0
 network 172.16.0.0
 no auto-summary
end
write memory
