! ==========================================
! Router 0 Configuration - Experiment 1.4
! Static Routing Lab (Left Router)
! ==========================================
enable
configure terminal
interface fastEthernet 0/0
 ip address 10.0.0.1 255.0.0.0
 no shutdown
 exit
interface fastEthernet 1/0
 ip address 192.168.1.1 255.255.255.0
 no shutdown
 exit
! Static route to LAN 2 via Router 1 next-hop
ip route 20.0.0.0 255.0.0.0 192.168.1.2
end
write memory
