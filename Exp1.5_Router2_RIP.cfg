! ==========================================
! Router 2 Configuration - Experiment 1.5 (Dynamic Routing RIP)
! Device recommendation: "Router-PT"
! ==========================================
enable
configure terminal
! WAN link to Router 3
interface serial 2/0
 ip address 40.0.0.1 255.0.0.0
 clock rate 64000
 no shutdown
 exit
! WAN link to Router 0
interface serial 3/0
 ip address 20.0.0.2 255.0.0.0
 no shutdown
 exit
! RIP Routing Configuration
router rip
 version 2
 network 20.0.0.0
 network 40.0.0.0
 no auto-summary
end
write memory
